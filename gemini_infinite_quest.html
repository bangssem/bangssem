<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제미나이 인피니트 퀘스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #090d16;
            color: #e2e8f0;
        }
        .title-font {
            font-family: 'Orbitron', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1a202c;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.8); }
        }
        .glow-box {
            animation: pulseGlow 3s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-950 to-slate-950">

    <header class="w-full max-w-4xl text-center py-4">
        <h1 class="title-font text-3xl md:text-5xl font-extrabold tracking-wider bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent drop-shadow-lg">
            GEMINI INFINITE QUEST
        </h1>
        <p class="text-sm md:text-base text-purple-300 mt-2 font-light">
            AI 마스터와 함께 떠나는 끝없는 상상 모험 RPG
        </p>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col bg-slate-900/80 backdrop-blur-md border border-purple-500/30 rounded-2xl shadow-2xl overflow-hidden my-2 glow-box">
        
        <!-- Status Bar -->
        <div class="bg-slate-950/80 px-6 py-3 border-b border-purple-500/20 flex flex-wrap justify-between items-center text-xs md:text-sm">
            <div class="flex items-center space-x-4">
                <span class="flex items-center text-emerald-400 font-bold">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping mr-2"></span>
                    HP: <span id="stat-hp" class="ml-1 text-white">100</span>/100
                </span>
                <span class="text-cyan-400 font-bold">
                    골드: <span id="stat-gold" class="ml-1 text-white">50</span>G
                </span>
            </div>
            <div class="text-purple-300 font-medium">
                현재 장소: <span id="stat-location" class="text-pink-400 font-bold">신비로운 차원의 정문</span>
            </div>
        </div>

        <!-- Chat / Story Log Area -->
        <div id="story-log" class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar space-y-4 text-sm md:text-base leading-relaxed">
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-white shrink-0 title-font shadow-md">AI</div>
                <div class="bg-slate-800/90 border border-purple-500/30 p-4 rounded-2xl rounded-tl-none text-slate-200 shadow-md max-w-[85%]">
                    <p class="font-semibold text-purple-300 mb-1">제미나이 게임 마스터</p>
                    <p>환영합니다, 모험가님! 당신은 수많은 차원의 비밀이 잠들어 있는 전설의 '넥서스 타워' 입구에 서 있습니다. 거대한 수정 골렘이 길을 가로막고 당신을 노려보고 있군요. 당신은 어떻게 하시겠습니까?</p>
                </div>
            </div>
        </div>

        <div class="p-4 bg-slate-950/90 border-t border-purple-500/20">
            <!-- Quick Suggestions -->
            <div id="suggestion-chips" class="flex flex-wrap gap-2 mb-3">
                <button onclick="sendAction('수정 골렘에게 과자를 건네며 친구가 되자고 한다.')" class="px-3 py-1.5 text-xs bg-purple-900/50 hover:bg-purple-800 text-purple-200 border border-purple-500/40 rounded-full transition shadow-sm">🍪 과자 건네기</button>
                <button onclick="sendAction('빛의 검을 소환해 정면으로 돌진한다!')" class="px-3 py-1.5 text-xs bg-purple-900/50 hover:bg-purple-800 text-purple-200 border border-purple-500/40 rounded-full transition shadow-sm">⚔️ 정면 돌진</button>
                <button onclick="sendAction('투명 마법을 쓰고 몰래 골렘의 다리 사이로 지나간다.')" class="px-3 py-1.5 text-xs bg-purple-900/50 hover:bg-purple-800 text-purple-200 border border-purple-500/40 rounded-full transition shadow-sm">👻 투명 마법 잠입</button>
            </div>

            <!-- Input Form -->
            <form id="action-form" onsubmit="handleFormSubmit(event)" class="flex gap-2">
                <input type="text" id="user-input" placeholder="하고 싶은 행동을 자유롭게 입력하세요 (예: 멋지게 춤을 춘다)" 
                    class="flex-1 bg-slate-900 border border-purple-500/40 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm md:text-base shadow-inner">
                <button type="submit" id="send-btn" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg flex items-center justify-center shrink-0 title-font text-sm">
                    행동하기
                </button>
            </form>
        </div>

    </main>

    <script>
        let gameState = {
            hp: 100,
            gold: 50,
            location: "신비로운 차원의 정문",
            history: [
                { role: "model", parts: [{ text: "환영합니다, 모험가님! 당신은 수많은 차원의 비밀이 잠들어 있는 전설의 '넥서스 타워' 입구에 서 있습니다. 거대한 수정 골렘이 길을 가로막고 당신을 노려보고 있군요. 당신은 어떻게 하시겠습니까?" }] }
            ]
        };

        const storyLog = document.getElementById('story-log');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statHp = document.getElementById('stat-hp');
        const statGold = document.getElementById('stat-gold');
        const statLocation = document.getElementById('stat-location');

        function appendMessage(sender, text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 ${isUser ? 'justify-end' : ''}`;

            if (!isUser) {
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-white shrink-0 title-font shadow-md">AI</div>
                    <div class="bg-slate-800/90 border border-purple-500/30 p-4 rounded-2xl rounded-tl-none text-slate-200 shadow-md max-w-[85%]">
                        <p class="font-semibold text-purple-300 mb-1">제미나이 게임 마스터</p>
                        <p class="whitespace-pre-line">${escapeHtml(text)}</p>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="bg-indigo-900/80 border border-indigo-500/40 p-4 rounded-2xl rounded-tr-none text-slate-100 shadow-md max-w-[85%]">
                        <p class="font-semibold text-indigo-300 mb-1 text-right">모험가</p>
                        <p class="whitespace-pre-line">${escapeHtml(text)}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white shrink-0 title-font shadow-md">나</div>
                `;
            }
            storyLog.appendChild(messageDiv);
            storyLog.scrollTop = storyLog.scrollHeight;
        }

        function appendLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.className = 'flex items-start space-x-3';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-white shrink-0 title-font shadow-md animate-pulse">AI</div>
                <div class="bg-slate-800/90 border border-purple-500/30 p-4 rounded-2xl rounded-tl-none text-slate-400 shadow-md italic flex items-center space-x-2">
                    <span>마스터가 주사위를 굴리고 운명을 기록하는 중입니다</span>
                    <span class="flex space-x-1">
                        <span class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce"></span>
                        <span class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </span>
                </div>
            `;
            storyLog.appendChild(loadingDiv);
            storyLog.scrollTop = storyLog.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function sendAction(actionText) {
            if (!actionText.trim()) return;
            userInput.value = '';
            runGameTurn(actionText);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const text = userInput.value;
            if (!text.trim()) return;
            userInput.value = '';
            runGameTurn(text);
        }

        async function runGameTurn(actionText) {
            appendMessage("", actionText, true);
            gameState.history.push({ role: "user", parts: [{ text: actionText }] });

            appendLoading();
            sendBtn.disabled = true;
            userInput.disabled = true;

            const systemInstruction = `당신은 판타지 텍스트 RPG 게임 마스터(Gemini Game Master)입니다. 
사용자의 자유로운 행동에 따라 흥미진진하고 몰입감 있는 스토리를 전개하세요.
반드시 아래 JSON 형식으로만 응답해야 합니다. 마크다운 코드블록이나 다른 텍스트를 포함하지 말고 순수 JSON 문자열만 반환하세요.

{
    "story": "사용자의 행동에 따른 스토리 전개 결과 (2~4문장으로 흥미롭고 생생하게 작성)",
    "hp_change": 0,
    "gold_change": 0,
    "location": "현재 장소 이름 (이동했거나 유지)",
    "suggestions": ["다음 추천 행동 1", "다음 추천 행동 2", "다음 추천 행동 3"]
}`;

            const payload = {
                contents: gameState.history,
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;

            let success = false;
            let resultData = null;
            let attempts = 0;
            let delay = 1000;

            while (!success && attempts < 4) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const jsonString = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (jsonString) {
                        const cleanJson = jsonString.replace(/```json/gi, '').replace(/```/g, '').trim();
                        resultData = JSON.parse(cleanJson);
                        success = true;
                    } else {
                        throw new Error("Invalid response format");
                    }
                } catch (err) {
                    attempts++;
                    if (attempts >= 4) {
                        // 폴백 처리
                        resultData = {
                            story: "차원의 왜곡으로 인해 마스터의 집중이 흐트러졌습니다. 다시 한 번 행동을 시도해주세요!",
                            hp_change: 0,
                            gold_change: 0,
                            location: gameState.location,
                            suggestions: ["주변을 살핀다", "정면으로 돌격한다", "도망친다"]
                        };
                        success = true;
                    } else {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
            }

            removeLoading();
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();

            if (resultData) {
                gameState.hp = Math.max(0, Math.min(100, gameState.hp + (resultData.hp_change || 0)));
                gameState.gold = Math.max(0, gameState.gold + (resultData.gold_change || 0));
                gameState.location = resultData.location || gameState.location;

                statHp.textContent = gameState.hp;
                statGold.textContent = gameState.gold;
                statLocation.textContent = gameState.location;

                appendMessage("", resultData.story, false);
                gameState.history.push({ role: "model", parts: [{ text: resultData.story }] });

                // 제안 버튼 업데이트
                const suggestionsContainer = document.getElementById('suggestion-chips');
                suggestionsContainer.innerHTML = '';
                if (resultData.suggestions && Array.isArray(resultData.suggestions)) {
                    resultData.suggestions.forEach(suggestion => {
                        const btn = document.createElement('button');
                        btn.className = 'px-3 py-1.5 text-xs bg-purple-900/50 hover:bg-purple-800 text-purple-200 border border-purple-500/40 rounded-full transition shadow-sm';
                        btn.textContent = suggestion;
                        btn.onclick = () => sendAction(suggestion);
                        suggestionsContainer.appendChild(btn);
                    });
                }

                if (gameState.hp <= 0) {
                    appendMessage("", "💀 체력이 모두 소모되어 모험이 종료되었습니다. 페이지를 새로고침하여 다시 도전하세요!", false);
                    sendBtn.disabled = true;
                    userInput.disabled = true;
                }
            }
        }
    </script>
</body>
</html>
